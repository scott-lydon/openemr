# Clinical Co-Pilot sidecar stack.
# Runs alongside an existing OpenEMR docker network (e.g. development-easy).
# To attach to OpenEMR's network add `network_mode: "service:openemr"`
# or join the same external network.
services:
  postgres:
    # pgvector/pgvector includes the vector extension preloaded;
    # alembic just needs to ``CREATE EXTENSION vector;`` (the
    # guideline_chunks migration does this).
    image: pgvector/pgvector:pg16
    container_name: copilot-postgres
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5433:5432"
    volumes:
      - copilot-pgdata:/var/lib/postgresql/data
      - ./sidecar/audit/schema.sql:/docker-entrypoint-initdb.d/01-audit.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copilot-sidecar
    env_file:
      - .env
    environment:
      COPILOT_DATABASE_URL: postgresql+psycopg://copilot:copilot@postgres:5432/copilot
    volumes:
      # SMART Backend Services keypair. The sidecar's
      # OpenEMRTokenCache signs JWT-bearer client assertions with
      # the private RSA key at /app/.keys/openemr-jwt-bearer.pem
      # (the path COPILOT_OPENEMR_PRIVATE_KEY_PATH points at).
      # setup-openemr-client.sh writes the key + JWKS pair to
      # ./.keys/ on the host. Read-only because the sidecar only
      # signs with it, never rewrites it.
      - ./.keys:/app/.keys:ro
    ports:
      - "8801:8801"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copilot-bff
    env_file:
      - .env
    environment:
      COPILOT_DATABASE_URL: postgresql+psycopg://copilot:copilot@postgres:5432/copilot
      COPILOT_SIDECAR_URL: http://sidecar:8801
    command: ["uvicorn", "bff.main:app", "--host", "0.0.0.0", "--port", "8800"]
    ports:
      - "8800:8800"
    depends_on:
      sidecar:
        condition: service_started
      postgres:
        condition: service_healthy
    extra_hosts:
      - "localhost:host-gateway"
    # Override the Dockerfile HEALTHCHECK, which targets the sidecar
    # port 8801. The bff listens on 8800; without this override docker
    # reports copilot-bff as unhealthy forever even though /health
    # returns 200. Use python -c rather than curl because the image
    # does not ship curl.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8800/health', timeout=2)"
          || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  copilot-pgdata:
