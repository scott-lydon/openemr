; Alembic configuration for the Clinical Co-Pilot sidecar.
;
; The script_location is relative to this file. We keep migrations under
; sidecar/migrations so they ship inside the package and can be invoked
; from a deployed container without a separate "migrations" volume mount.
;
; The sqlalchemy.url is read from the COPILOT_DATABASE_URL environment
; variable in env.py, so this file does NOT contain a database URL. That
; keeps the URL out of the source tree (no credential leak risk via a
; misplaced ini), and lets each environment (dev, CI, prod) point at its
; own database without a config-file rewrite.

[alembic]
script_location = sidecar/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://placeholder:placeholder@placeholder/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
