# Local development compose file for the Patient Dashboard.
#
# This file is INDEPENDENT of OpenEMR's docker/development-easy stack.
# It connects to OpenEMR over the host network so you can keep both
# stacks running side by side.
#
# Usage:
#   1. Boot the OpenEMR stack:
#        cd ../docker/development-easy && docker compose up -d --wait
#   2. Provision an OAuth client and write credentials into .env.local:
#        bash scripts/register-oauth-client.sh
#   3. Boot the dashboard:
#        cd ../patient-dashboard && docker compose up -d --build
#   4. Open http://localhost:8400/
#
# Production deploy: the same Dockerfile is used, but on Hetzner the
# service is added to /opt/openemr/docker-compose.yml so it joins the
# OpenEMR docker network and reaches OpenEMR via DNS name "openemr".

services:
  patient-dashboard:
    build:
      context: .
      args:
        # Bake the git sha into the bundle so /healthz reports it. The
        # default falls back to "dev" if git isn't available at build
        # time (e.g. CI without a checkout).
        BUILD_SHA: ${BUILD_SHA:-dev}
    image: openemr-patient-dashboard:${TAG:-dev}
    container_name: openemr-patient-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8400:8400"
    env_file:
      - .env.local
    environment:
      # AUTH_TRUST_HOST=1 so Auth.js trusts the request's Host header
      # whenever AUTH_URL is not pinned (the env_file should pin it in
      # production). Safe to set unconditionally because the dashboard
      # is only reached over the OpenEMR host's reverse-proxy or a
      # known LAN address — never over an arbitrary tenant header.
      AUTH_TRUST_HOST: "1"
      #
      # IMPORTANT: do NOT redeclare OPENEMR_ISSUER, OPENEMR_FHIR_BASE,
      # or AUTH_URL here, even with `${VAR:-default}`. Compose's
      # `environment:` block overrides `env_file:`, and the Hetzner
      # host shell does not export those variables, so any `${VAR:-…}`
      # default silently wins on production deploys. That bug shipped
      # twice in 24 hours:
      #   1. AUTH_URL=${AUTH_URL:-http://localhost:8400} forced every
      #      Modern Dashboard button click to 302 to localhost.
      #   2. OPENEMR_ISSUER=${...:-http://host.docker.internal:8300/...}
      #      pointed Auth.js at a host:port pair that does not exist on
      #      Hetzner (port 8300 is local-docker only; prod is port 80),
      #      so the OAuth handshake failed with `[auth][error] fetch
      #      failed`.
      # All three values belong in .env.local. The env_file provides
      # them. Local devs whose OpenEMR runs on host.docker.internal:8300
      # set those values in their own .env.local.
    extra_hosts:
      # Make host.docker.internal work on Linux as well as macOS.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8400/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
